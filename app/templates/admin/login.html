<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login ? TrendBlogo</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">
  
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <img src="/static/images/logo-dark.svg" alt="TrendBlogo" class="h-10 w-auto mx-auto mb-4">
      <h1 class="text-xl font-bold text-white tracking-tight">Admin Console</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to manage automated publishing workflows</p>
    </div>

    {% if error %}
    <div class="mb-6 p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs flex items-center space-x-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/admin/login" method="POST" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <input type="email" name="email" value="admin@trendblogo.com" required class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
          <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input type="password" name="password" value="Admin123!" required class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 transition">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg transition">
        Sign In to Dashboard
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
      <p>Default credentials pre-filled for local evaluation.</p>
      <a href="/" class="text-indigo-400 hover:underline mt-2 inline-block">&larr; Return to Public Website</a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
