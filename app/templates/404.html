{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-20 px-4">
  <div class="text-center max-w-lg">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-indigo-50 border border-indigo-200 text-indigo-600 font-extrabold text-3xl mb-6 shadow-sm">
      404
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-3">Page Not Found</h1>
    <p class="text-slate-500 text-sm leading-relaxed mb-8">
      The requested resource has either been moved, updated, or does not exist. Use the search bar below or return to the publication home.
    </p>
    
    <form action="/search" method="GET" class="relative max-w-md mx-auto mb-6">
      <input type="text" name="q" placeholder="Search articles..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 outline-none focus:border-indigo-500 shadow-sm">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
    </form>

    <div class="flex items-center justify-center space-x-4 text-xs font-semibold">
      <a href="/" class="px-5 py-2.5 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">Return Home</a>
      <a href="/blog" class="px-5 py-2.5 bg-white border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50 transition">Browse Blog</a>
    </div>
  </div>
</div>
{% endblock %}
