<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <linearGradient id="accGrad_2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>
    <filter id="blurFilter_2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <pattern id="grid_2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad_2)" />
  <rect width="1200" height="675" fill="url(#grid_2)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#2DD4BF" opacity="0.22" filter="url(#blurFilter_2)" />
  <circle cx="1000" cy="450" r="220" fill="#99F6E4" opacity="0.18" filter="url(#blurFilter_2)" />

  <!-- Thematic Center Illustration Graphic -->
  <g transform="translate(620, 100)">
    
            <rect x="80" y="60" width="360" height="240" rx="14" fill="rgba(255,255,255,0.03)" stroke="#2DD4BF" stroke-width="1.5" />
            <path d="M 110 240 L 170 190 L 230 210 L 290 130 L 350 160 L 410 90" fill="none" stroke="#99F6E4" stroke-width="4" stroke-linecap="round" />
            <circle cx="410" cy="90" r="6" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="2" />
            <line x1="110" y1="260" x2="410" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
            <rect x="140" y="210" width="24" height="50" rx="4" fill="#2DD4BF" opacity="0.4" />
            <rect x="200" y="180" width="24" height="80" rx="4" fill="#2DD4BF" opacity="0.6" />
            <rect x="260" y="140" width="24" height="120" rx="4" fill="#99F6E4" opacity="0.8" />
            <rect x="320" y="110" width="24" height="150" rx="4" fill="#FFFFFF" opacity="0.9" />
            
  </g>

  <!-- Content Banner / Overlay Card -->
  <g transform="translate(80, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="38" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <circle cx="24" cy="19" r="6" fill="#2DD4BF" />
    <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#99F6E4">BEST PRODUCTIVITY APPS</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Top Ranked Productivity Suites and Benchmarks</text>
    
    <!-- Meta details -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255, 255, 255, 0.65)">TrendBlogo Intelligence ? Automated Editorial Architecture</text>

    <!-- Visual Indicator Line -->
    <rect x="0" y="180" width="120" height="4" rx="2" fill="url(#accGrad_2)" />
  </g>

  <!-- Watermark / Brand Badge -->
  <g transform="translate(80, 605)">
    <rect x="0" y="0" width="150" height="32" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">TrendBlogo AI</text>
  </g>
</svg>