<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad_0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accGrad_0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <filter id="blurFilter_0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <pattern id="grid_0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad_0)" />
  <rect width="1200" height="630" fill="url(#grid_0)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#818CF8" opacity="0.22" filter="url(#blurFilter_0)" />
  <circle cx="1000" cy="450" r="220" fill="#C7D2FE" opacity="0.18" filter="url(#blurFilter_0)" />

  <!-- Thematic Center Illustration Graphic -->
  <g transform="translate(620, 100)">
    
            <polygon points="240,40 440,150 240,260 40,150" fill="rgba(255,255,255,0.04)" stroke="#818CF8" stroke-width="2" />
            <polygon points="240,90 380,170 240,250 100,170" fill="rgba(255,255,255,0.08)" stroke="#C7D2FE" stroke-width="1.5" />
            <line x1="240" y1="260" x2="240" y2="360" stroke="#818CF8" stroke-width="2" stroke-dasharray="6,6" />
            <!-- Floating Data Cubes -->
            <rect x="180" y="100" width="50" height="50" rx="8" fill="#818CF8" opacity="0.85" />
            <rect x="270" y="70" width="40" height="40" rx="6" fill="#C7D2FE" opacity="0.9" />
            <circle cx="240" cy="150" r="16" fill="#FFFFFF" />
            <circle cx="240" cy="150" r="32" stroke="#C7D2FE" stroke-width="2" opacity="0.6" />
            
  </g>

  <!-- Content Banner / Overlay Card -->
  <g transform="translate(80, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="38" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <circle cx="24" cy="19" r="6" fill="#818CF8" />
    <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#C7D2FE">ENTERPRISE WORKFLOW AUTOMATION</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Hero Overview</text>
    
    <!-- Meta details -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255, 255, 255, 0.65)">TrendBlogo Intelligence ? Automated Editorial Architecture</text>

    <!-- Visual Indicator Line -->
    <rect x="0" y="180" width="120" height="4" rx="2" fill="url(#accGrad_0)" />
  </g>

  <!-- Watermark / Brand Badge -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="150" height="32" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">TrendBlogo AI</text>
  </g>
</svg>