<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accGrad_1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <filter id="blurFilter_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <pattern id="grid_1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad_1)" />
  <rect width="1200" height="675" fill="url(#grid_1)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#38BDF8" opacity="0.22" filter="url(#blurFilter_1)" />
  <circle cx="1000" cy="450" r="220" fill="#7DD3FC" opacity="0.18" filter="url(#blurFilter_1)" />

  <!-- Thematic Center Illustration Graphic -->
  <g transform="translate(620, 100)">
    
            <circle cx="200" cy="160" r="70" fill="none" stroke="#38BDF8" stroke-width="2" />
            <circle cx="360" cy="120" r="50" fill="none" stroke="#7DD3FC" stroke-width="2" />
            <circle cx="280" cy="280" r="60" fill="none" stroke="#38BDF8" stroke-width="1.5" />
            <line x1="200" y1="160" x2="360" y2="120" stroke="#38BDF8" stroke-width="2" />
            <line x1="360" y1="120" x2="280" y2="280" stroke="#7DD3FC" stroke-width="2" />
            <line x1="280" y1="280" x2="200" y2="160" stroke="#38BDF8" stroke-width="2" />
            <circle cx="200" cy="160" r="14" fill="#38BDF8" />
            <circle cx="360" cy="120" r="12" fill="#7DD3FC" />
            <circle cx="280" cy="280" r="16" fill="#FFFFFF" />
            
  </g>

  <!-- Content Banner / Overlay Card -->
  <g transform="translate(80, 160)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="38" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
    <circle cx="24" cy="19" r="6" fill="#38BDF8" />
    <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7DD3FC">AUTOMATED SEO TOOLS</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Section One Overview</text>
    
    <!-- Meta details -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255, 255, 255, 0.65)">TrendBlogo Intelligence ? Automated Editorial Architecture</text>

    <!-- Visual Indicator Line -->
    <rect x="0" y="180" width="120" height="4" rx="2" fill="url(#accGrad_1)" />
  </g>

  <!-- Watermark / Brand Badge -->
  <g transform="translate(80, 605)">
    <rect x="0" y="0" width="150" height="32" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">TrendBlogo AI</text>
  </g>
</svg>